name: Release

# main'e Cargo.toml'daki sürümü değiştiren bir birleştirme geldiğinde (ör. "Release 1.2.0" PR'ı)
# ya da "v0.4.0" gibi bir etiket elle gönderildiğinde .deb derlenir, SHA256SUMS üretilir ve
# GitHub sürümü oluşturulur. main'den gelince etiketi (vX.Y.Z) sürümü oluştururken iş akışı açar;
# etiketin elle gönderilmesi gerekmez. GPG_PRIVATE_KEY (ve isteğe bağlı GPG_PASSPHRASE) gizli değişkeni
# tanımlıysa SHA256SUMS imzalanır (SHA256SUMS.asc).

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    # Hangi sürüm? Etiketten ya da main'de Cargo.toml'dan. O sürüm zaten yayınlandıysa
    # (elle ya da önceki bir çalışmada) tekrar derleyip dosyaların üzerine yazma.
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.view.outputs.exists }}
      tag: ${{ steps.view.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: view
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release $tag already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Releasing $tag"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    env:
      TAG: ${{ needs.check.outputs.tag }}
    # GTK 4.14 ve libadwaita 1.5 gerekir: Ubuntu 24.04 / Linux Mint 22 tabanı.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (GTK 4, libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "$TAG" || { echo "Tag $TAG != Cargo.toml v$v"; exit 1; }
      - run: cargo test --workspace
      - name: Build package
        run: packaging/build-deb.sh
      - name: Collect artifacts and checksums
        run: |
          mkdir dist
          cp target/debian/*.deb dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Sign checksums (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist && gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          v=${TAG#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: dist/*
