name: Release

# "v0.4.0" gibi bir etiket gönderildiğinde .deb ve AppImage derlenir, SHA256SUMS üretilir ve
# GitHub sürümü oluşturulur. GPG_PRIVATE_KEY (ve isteğe bağlı GPG_PASSPHRASE) gizli değişkeni
# tanımlıysa SHA256SUMS imzalanır (SHA256SUMS.asc).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    # Sürüm elle (gh release create) yayınlandıysa tekrar derleyip dosyaların üzerine yazma.
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.view.outputs.exists }}
    steps:
      - id: view
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-22.04 # AppImage'ın eski glibc'lerde de çalışması için daha eski taban
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential libssl-dev libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check tag matches version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != Cargo.toml v$v"; exit 1; }
      - run: cargo test --workspace
      - name: Build packages
        working-directory: app
        run: npm ci && npx tauri build --bundles deb,appimage
      - name: Collect artifacts and checksums
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Sign checksums (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist && gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
