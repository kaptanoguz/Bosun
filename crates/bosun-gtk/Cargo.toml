[package]
name = "bosun-gtk"
description = "Bosun — Linux maintenance assistant (GTK4 / libadwaita interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "bosun"
path = "src/main.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5"
bosun-core = { path = "../bosun-core" }
chrono = "0.4.45"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "process", "macros"] }
