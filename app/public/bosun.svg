<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2E40"/><stop offset="1" stop-color="#0F1B26"/>
    </linearGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="200" y1="360" x2="820" y2="760">
      <stop offset="0" stop-color="#EBD08A"/><stop offset="1" stop-color="#B8893A"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <!-- kıl (keel): gövdeyi topa bağlayan levha -->
  <path d="M430 560 L 650 560 Q 700 560 700 610 L 700 640 L 470 640 Q 430 640 430 600 Z" fill="url(#brass)" opacity=".85"/>
  <!-- gövde (gun): ağızlıktan topa uzanan boru -->
  <path d="M200 470 L 560 470" stroke="url(#brass)" stroke-width="72" stroke-linecap="round"/>
  <path d="M200 470 L 560 470" stroke="#0F1B26" stroke-width="14" stroke-linecap="round" opacity=".35"/>
  <!-- top (buoy) ve üstündeki delik -->
  <circle cx="680" cy="500" r="140" fill="url(#brass)"/>
  <ellipse cx="680" cy="420" rx="62" ry="24" fill="#0F1B26"/>
  <!-- halka -->
  <circle cx="560" cy="712" r="40" fill="none" stroke="url(#brass)" stroke-width="22"/>
</svg>
