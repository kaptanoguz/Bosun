[package]
name = "bosun-app"
description = "Bosun — Linux sistem bakım asistanı"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/kaptanoguz/Bosun"

[lib]
name = "bosun_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
bosun-core = { path = "../../crates/bosun-core" }
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "process"] }
