# ~/.config/bosun/config.toml  (izinleri: chmod 600)
language = "en"                    # "en" ya da "tr"; uygulamadaki Ayarlar ekranından da değişir
# Sohbet sağlayıcısı: anthropic | xai | google | openai | custom
# Hepsi uygulamadaki Settings → Chat bölümünden de ayarlanabilir.
provider = "anthropic"
model = ""                         # boş: sağlayıcının varsayılan modeli
# base_url = "http://localhost:11434/v1"   # yalnızca custom (Ollama, LM Studio…) için

[api_keys]
# anthropic = "sk-ant-..."         # ya da ANTHROPIC_API_KEY
# xai = "xai-..."                  # ya da XAI_API_KEY
# google = "AIza..."               # ya da GEMINI_API_KEY
# openai = "sk-..."                # ya da OPENAI_API_KEY
share_file_paths = false           # büyük dosya yollarını Claude'a gönderme
sample_interval_secs = 5
scan_interval_secs = 600
notifications = true
persist_chat = true                # sohbet geçmişini ~/.local/state/bosun/chats.json'da sakla

[thresholds]
disk_warn = 85.0
disk_crit = 95.0
mem_warn = 90.0
mem_sustain_secs = 300
swap_warn = 50.0
cpu_busy = 90.0                    # toplam CPU bu yüzdenin üzerinde…
cpu_sustain_secs = 60              # …bu kadar saniye kalırsa "CPU meşgul" bulgusu
leak_mb_per_hour = 100             # belleği saatte en az bu kadar MB…
leak_minutes = 45                  # …bu kadar dakika boyunca düzenli büyüyen uygulama bildirilir
temp_crit = 85.0
reclaimable_info_gb = 2.0
stale_days = 30                    # bu kadar gündür değişmeyen önbellek/günlük dosyaları "eski"
large_file_mb = 500                # İndirilenler'de listelenecek en küçük dosya boyutu
